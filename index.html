    <!-- Google Ads click IDs: persist on landing so GA4 + CAPI keep attributing
         to the original ad click even after a SPA route change or a bounce back. -->
    <script>
    (function () {
      try {
        var KEYS = ['gclid', 'gbraid', 'wbraid', 'msclkid', 'fbclid', '_fbc', '_fbp', 'ttclid', 'ttp', 'epid'];
        var qs = new URLSearchParams(window.location.search);
        var found = [];
        KEYS.forEach(function (k) {
          var v = qs.get(k);
          if (!v) return;
          found.push(k);
          var days = (k === 'ttclid' || k === 'ttp' || k === 'epid') ? 7 : 90;
          document.cookie = k + '=' + encodeURIComponent(v) + '; path=/; max-age=' + (days * 86400) + '; SameSite=Lax';
        });
        if (found.length) {
          // Persist through CAPI so the server-side copy shares the same click.
          try { sessionStorage.setItem('adclicks', found.join(',')); } catch (e) {}
        }
      } catch (e) {}
    })();
    </script>
